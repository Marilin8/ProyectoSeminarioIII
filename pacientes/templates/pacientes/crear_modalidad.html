{% extends "base.html" %}

{% block content %}
<div style="max-width: 700px; margin: 30px auto;">

    <div style="margin-bottom: 20px;">
        <h2 style="margin-bottom: 6px;">
            {% if editando %}
                Editar modalidad
            {% else %}
                Nueva modalidad
            {% endif %}
        </h2>

        <p style="color:#64748b; margin:0;">
            {% if editando %}
                Modifique el nombre de la modalidad.
            {% else %}
                Registre una nueva modalidad para los estudios.
            {% endif %}
        </p>
    </div>

    <div style="background:white; border:1px solid #e2e8f0; border-radius:10px; padding:24px;">

        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom:20px;">
                <label for="nombre"
                       style="display:block; font-weight:600; margin-bottom:8px;">
                    Nombre de la modalidad
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                    maxlength="120"
                    value="{% if editando %}{{ modalidad.nombre }}{% endif %}"
                    placeholder="Ej. Resonancia magnética"
                    style="width:100%; padding:11px 12px; border:1px solid #cbd5e1; border-radius:8px;"
                >
            </div>

            <div style="display:flex; gap:10px;">
                <button
                    type="submit"
                    style="padding:10px 18px; background:#2563eb; color:white; border:none; border-radius:8px; cursor:pointer;">
                    {% if editando %}
                        Guardar cambios
                    {% else %}
                        Crear modalidad
                    {% endif %}
                </button>

                <a
                    href="{% url 'lista_modalidades' %}"
                    style="padding:10px 18px; border:1px solid #cbd5e1; border-radius:8px; text-decoration:none;">
                    Cancelar
                </a>
            </div>
        </form>

    </div>

</div>
{% endblock %}
