<!-- Campanita de notificaciones: vive en la barra lateral (un solo
     include global en templates/base.html, no uno por pantalla).
     Consulta {% url 'notificaciones_pendientes' %} cada 20s y hace sonar
     un aviso cuando llega algo nuevo (cita asignada, orden pendiente,
     estudio listo para informar o estudio completado). -->
<div id="notif-campanita" class="notif-wrap">
    <button type="button" id="notif-boton" class="notif-boton" aria-label="Notificaciones" title="Notificaciones">
        <svg width="16" height="16"><use href="#i-bell"/></svg>
        <span>Notificaciones</span>
        <span id="notif-contador" class="notif-contador" hidden>0</span>
    </button>
    <div id="notif-panel" class="notif-panel" hidden>
        <div class="notif-panel-cabecera">
            <span>
                <svg width="15" height="15"><use href="#i-bell"/></svg>
                Notificaciones
            </span>
            <button type="button" id="notif-marcar-todas">
                <svg width="12" height="12"><use href="#i-check"/></svg>
                Marcar todas leídas
            </button>
        </div>
        <ul id="notif-lista" class="notif-lista">
            <li class="notif-vacio">
                <svg width="30" height="30"><use href="#i-bell"/></svg>
                <span>Sin notificaciones nuevas.</span>
                <small>Acá van a aparecer los avisos de citas, órdenes y estudios.</small>
            </li>
        </ul>
    </div>
    <form id="notif-csrf-form" hidden>{% csrf_token %}</form>
</div>

<style>
    .notif-wrap {
        position: relative;
    }
    .notif-boton {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.6rem 1rem;
        border: none;
        border-left: 3px solid transparent;
        background: none;
        color: var(--sidebar-text);
        cursor: pointer;
        font-size: 0.82rem;
        font-family: inherit;
        text-align: left;
        transition: background var(--transition), color var(--transition);
    }
    .notif-boton:hover {
        background: var(--sidebar-hover);
        color: white;
    }
    .notif-boton span:first-of-type { flex: 1; }
    .notif-boton.notif-agitar svg {
        animation: notif-agitar .5s ease;
    }
    @keyframes notif-agitar {
        0%, 100% { transform: rotate(0); }
        20%, 60% { transform: rotate(-15deg); }
        40%, 80% { transform: rotate(15deg); }
    }
    .notif-contador {
        background: var(--danger, #dc2626);
        color: #fff;
        border-radius: 999px;
        font-size: .68rem;
        font-weight: 700;
        line-height: 1;
        padding: .27rem .42rem;
        min-width: 1.1rem;
        text-align: center;
        flex-shrink: 0;
        box-shadow: 0 0 0 2px var(--sidebar-bg, #0f172a);
    }
    .notif-panel {
        /* fixed (no absolute) a propósito: el sidebar tiene overflow-y:
           auto, y CSS fuerza overflow-x a auto también en ese caso, lo que
           recortaría un panel absoluto que sobresale del ancho del
           sidebar. La posición real la calcula el JS de más abajo. */
        position: fixed;
        width: 340px;
        max-height: 440px;
        display: flex;
        flex-direction: column;
        background: var(--card, #fff);
        border-radius: var(--radius-lg, 12px);
        box-shadow: var(--shadow-lg, 0 10px 30px rgba(0,0,0,.2));
        border: 1px solid var(--border-light, #e2e8f0);
        z-index: 9999;
        overflow: hidden;
        animation: notif-panel-entrada .12s ease-out;
    }
    @keyframes notif-panel-entrada {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .notif-panel-cabecera {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.6rem;
        padding: .75rem 1rem;
        background: linear-gradient(135deg, var(--primary, #1e40af), var(--primary-dark, #1e3a8a));
        color: #fff;
        font-size: .85rem;
        font-weight: 700;
        flex-shrink: 0;
    }
    .notif-panel-cabecera > span:first-child {
        display: flex;
        align-items: center;
        gap: .4rem;
    }
    .notif-panel-cabecera button {
        display: flex;
        align-items: center;
        gap: .3rem;
        background: rgba(255,255,255,.15);
        border: none;
        border-radius: 999px;
        color: #fff;
        font-size: .7rem;
        font-weight: 600;
        cursor: pointer;
        padding: .32rem .6rem;
        transition: background var(--transition);
        white-space: nowrap;
    }
    .notif-panel-cabecera button:hover {
        background: rgba(255,255,255,.28);
    }
    .notif-lista {
        list-style: none;
        margin: 0;
        padding: .35rem;
        overflow-y: auto;
        flex: 1;
        min-height: 0;
    }
    .notif-item {
        display: flex;
        align-items: flex-start;
        gap: .65rem;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-radius: var(--radius, 8px);
        padding: .55rem .6rem;
        cursor: pointer;
        transition: background var(--transition);
    }
    .notif-item:hover {
        background: var(--bg, #f0f4f8);
    }
    .notif-item-icono {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: .05rem;
    }
    .notif-item-icono.info { background: var(--info-light, #eff6ff); color: var(--info, #0ea5e9); }
    .notif-item-icono.success { background: var(--success-light, #dcfce7); color: var(--success, #16a34a); }
    .notif-item-icono.warning { background: var(--warning-light, #fef3c7); color: var(--warning, #f59e0b); }
    .notif-item-icono.danger { background: var(--danger-light, #fee2e2); color: var(--danger, #dc2626); }
    .notif-item-texto { min-width: 0; }
    .notif-item-mensaje {
        display: block;
        font-size: .8rem;
        color: var(--text, #1e293b);
        line-height: 1.35;
    }
    .notif-hora {
        display: flex;
        align-items: center;
        gap: .25rem;
        color: var(--text-muted, #64748b);
        font-size: .7rem;
        margin-top: .25rem;
    }
    .notif-vacio {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: .4rem;
        padding: 2rem 1.2rem;
        color: var(--text-muted, #64748b);
        text-align: center;
    }
    .notif-vacio svg { color: var(--border, #cbd5e1); }
    .notif-vacio span { font-size: .85rem; font-weight: 600; color: var(--text, #1e293b); }
    .notif-vacio small { font-size: .74rem; }
</style>

<script>
(function () {
    var URL_PENDIENTES = '{% url "notificaciones_pendientes" %}';
    var URL_MARCAR_UNA_PLANTILLA = '{% url "marcar_notificacion_leida" notificacion_id=0 %}';
    var URL_MARCAR_TODAS = '{% url "marcar_notificaciones_leidas" %}';
    var INTERVALO_MS = 20000;
    // Este tipo no se marca como leído con el simple clic: se queda en la
    // lista hasta que el dato pendiente del paciente realmente se completa
    // (ver pacientes.views.completar_datos_paciente).
    var TIPOS_QUE_NO_SE_MARCAN_AL_HACER_CLIC = ['datos_paciente_pendientes'];

    // Icono + color por tipo de notificación (ver Notificacion.TIPO_CHOICES
    // en pacientes/models.py), para que la lista se distinga de un vistazo
    // en vez de ser puro texto.
    var TIPO_ICONOS = {
        cita_asignada: ['i-calendar', 'info'],
        cita_confirmada: ['i-check-circle', 'success'],
        cita_rechazada: ['i-x-circle', 'danger'],
        cita_cancelada: ['i-x-circle', 'danger'],
        orden_pendiente: ['i-clipboard', 'warning'],
        estudio_listo_informar: ['i-file-medical', 'warning'],
        estudio_completado: ['i-check-circle', 'success'],
        datos_paciente_pendientes: ['i-user', 'warning'],
        reporte_enviado: ['i-file-text', 'info'],
        estudio_extra_agregado: ['i-plus', 'info'],
        estudio_validado: ['i-check-circle', 'success'],
        modificacion_solicitada: ['i-edit', 'warning'],
        estudio_actualizado: ['i-refresh', 'info']
    };
    var ICONO_DEFECTO = ['i-bell', 'info'];

    var boton = document.getElementById('notif-boton');
    var contador = document.getElementById('notif-contador');
    var panel = document.getElementById('notif-panel');
    var lista = document.getElementById('notif-lista');
    var botonMarcarTodas = document.getElementById('notif-marcar-todas');

    var idsYaSonados = new Set();
    var audioCtx = null;

    function obtenerCsrfToken() {
        var campo = document.querySelector('#notif-csrf-form input[name=csrfmiddlewaretoken]');
        return campo ? campo.value : '';
    }

    // Los navegadores no dejan reproducir audio sin una interacción previa
    // del usuario, así que el AudioContext se crea en el primer clic/tecla.
    function desbloquearAudio() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            audioCtx = null;
        }
    }
    document.addEventListener('click', desbloquearAudio, { once: true });
    document.addEventListener('keydown', desbloquearAudio, { once: true });

    function reproducirSonido() {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var ahora = audioCtx.currentTime;
        [880, 1318.5].forEach(function (frecuencia, i) {
            var osc = audioCtx.createOscillator();
            var ganancia = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = frecuencia;
            ganancia.gain.setValueAtTime(0.0001, ahora + i * 0.15);
            ganancia.gain.exponentialRampToValueAtTime(0.3, ahora + i * 0.15 + 0.02);
            ganancia.gain.exponentialRampToValueAtTime(0.0001, ahora + i * 0.15 + 0.3);
            osc.connect(ganancia).connect(audioCtx.destination);
            osc.start(ahora + i * 0.15);
            osc.stop(ahora + i * 0.15 + 0.35);
        });
    }

    function marcarLeida(id) {
        var url = URL_MARCAR_UNA_PLANTILLA.replace('/0/', '/' + id + '/');
        fetch(url, { method: 'POST', headers: { 'X-CSRFToken': obtenerCsrfToken() } });
    }

    function pintarNotificaciones(notificaciones) {
        lista.innerHTML = '';
        if (!notificaciones.length) {
            var vacio = document.createElement('li');
            vacio.className = 'notif-vacio';
            vacio.innerHTML =
                '<svg width="30" height="30"><use href="#i-bell"/></svg>' +
                '<span>Sin notificaciones nuevas.</span>' +
                '<small>Acá van a aparecer los avisos de citas, órdenes y estudios.</small>';
            lista.appendChild(vacio);
            return;
        }
        notificaciones.forEach(function (n) {
            var par = TIPO_ICONOS[n.tipo] || ICONO_DEFECTO;
            var li = document.createElement('li');
            var item = document.createElement('button');
            item.type = 'button';
            item.className = 'notif-item';

            var icono = document.createElement('span');
            icono.className = 'notif-item-icono ' + par[1];
            icono.innerHTML = '<svg width="16" height="16"><use href="#' + par[0] + '"/></svg>';

            var texto = document.createElement('span');
            texto.className = 'notif-item-texto';

            var mensaje = document.createElement('span');
            mensaje.className = 'notif-item-mensaje';
            mensaje.textContent = n.mensaje;

            var hora = document.createElement('span');
            hora.className = 'notif-hora';
            hora.innerHTML = '<svg width="11" height="11"><use href="#i-clock"/></svg>';
            hora.appendChild(document.createTextNode(n.creada_en));

            texto.appendChild(mensaje);
            texto.appendChild(hora);
            item.appendChild(icono);
            item.appendChild(texto);
            item.addEventListener('click', function () {
                if (TIPOS_QUE_NO_SE_MARCAN_AL_HACER_CLIC.indexOf(n.tipo) === -1) {
                    marcarLeida(n.id);
                }
                if (n.url) window.location.href = n.url;
            });
            li.appendChild(item);
            lista.appendChild(li);
        });
    }

    function consultar() {
        fetch(URL_PENDIENTES, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
            .then(function (respuesta) { return respuesta.json(); })
            .then(function (data) {
                var noLeidas = data.no_leidas || 0;
                if (noLeidas > 0) {
                    contador.hidden = false;
                    contador.textContent = noLeidas > 99 ? '99+' : String(noLeidas);
                } else {
                    contador.hidden = true;
                }

                var notificaciones = data.notificaciones || [];
                var nuevas = notificaciones.filter(function (n) { return !idsYaSonados.has(n.id); });
                if (nuevas.length) {
                    nuevas.forEach(function (n) { idsYaSonados.add(n.id); });
                    reproducirSonido();
                    boton.classList.remove('notif-agitar');
                    void boton.offsetWidth; // fuerza a reiniciar la animación
                    boton.classList.add('notif-agitar');
                }

                pintarNotificaciones(notificaciones);
            })
            .catch(function () { /* si falla el sondeo, se reintenta en el próximo ciclo */ });
    }

    function posicionarPanel() {
        var rect = boton.getBoundingClientRect();
        var izquierda = rect.right + 8;
        if (izquierda + 340 > window.innerWidth) {
            izquierda = Math.max(8, window.innerWidth - 348);
        }
        panel.style.top = Math.max(8, rect.top) + 'px';
        panel.style.left = izquierda + 'px';
    }

    boton.addEventListener('click', function (evento) {
        evento.stopPropagation();
        panel.hidden = !panel.hidden;
        if (!panel.hidden) { posicionarPanel(); }
    });
    window.addEventListener('resize', function () {
        if (!panel.hidden) { posicionarPanel(); }
    });
    document.addEventListener('click', function (evento) {
        if (!panel.hidden && !panel.contains(evento.target) && evento.target !== boton) {
            panel.hidden = true;
        }
    });
    botonMarcarTodas.addEventListener('click', function () {
        fetch(URL_MARCAR_TODAS, { method: 'POST', headers: { 'X-CSRFToken': obtenerCsrfToken() } })
            .then(consultar);
    });

    consultar();
    setInterval(consultar, INTERVALO_MS);
})();
</script>
