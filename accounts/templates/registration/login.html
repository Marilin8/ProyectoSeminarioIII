{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIME - Acceso</title>
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <style>
        body.standalone {
            background: #cfd3d8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .cime-background-blur {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-image: url("{% static 'img/cime-logo.jpg' %}");
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: center;
            filter: blur(6px) grayscale(35%) brightness(0.95);
            transform: scale(1.15);
            z-index: 0;
        }
        .cime-background-blur::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(160deg, rgba(75, 90, 100, 0.55), rgba(140, 120, 150, 0.45));
        }
        .cime-login-card {
            position: relative;
            z-index: 1;
            width: 340px;
            background: linear-gradient(180deg, #eef7f6 0%, #ffffff 55%);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 45px rgba(20, 40, 45, 0.35);
            padding: 2rem 2.25rem 2.25rem;
            animation: none;
        }
        .cime-login-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .cime-login-logo {
            max-width: 150px;
            margin-bottom: 0.75rem;
        }
        .cime-login-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #1f6f78;
            margin: 0;
            line-height: 1.3;
        }
        .cime-login-card label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #3c5a5e;
            margin-top: 1rem;
        }
        .cime-login-card label:first-of-type { margin-top: 0; }
        .cime-login-card .login-input {
            width: 100%;
            padding: 0.6rem 0.9rem;
            border-radius: 999px;
            border: 1.5px solid #c9a3d8;
            background: #ffffff;
            font-size: 0.95rem;
            color: #33414a;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .cime-login-card .login-input:focus {
            border-color: #8f5aa8;
            box-shadow: 0 0 0 3px rgba(143, 90, 168, 0.15);
        }
        .cime-login-card #id_password {
            border-color: #5fbcc4;
        }
        .cime-login-card #id_password:focus {
            border-color: #2f9aa3;
            box-shadow: 0 0 0 3px rgba(47, 154, 163, 0.15);
        }
        .cime-password-wrapper {
            position: relative;
        }
        .cime-password-wrapper .login-input {
            padding-right: 2.4rem;
        }
        .cime-password-toggle {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #2f9aa3;
            display: flex;
            align-items: center;
            user-select: none;
        }
        .cime-password-toggle svg {
            width: 20px;
            height: 20px;
        }
        .cime-forgot-password {
            text-align: right;
            margin: 0.4rem 0 1.25rem;
        }
        .cime-forgot-password a {
            font-size: 0.8rem;
            color: #2f9aa3;
            text-decoration: none;
        }
        .cime-forgot-password a:hover { text-decoration: underline; }
        .cime-btn-submit {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 999px;
            background: #6fa39c;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
        .cime-btn-submit:hover { background: #5b8c85; }
        .cime-login-card .errorlist { margin-bottom: 0.75rem; }
    </style>
</head>
<body class="standalone">
    {% include 'includes/icons.html' %}

    <div class="cime-background-blur"></div>

    <div class="cime-login-card">
        <div class="cime-login-header">
            <img src="{% static 'img/cime-logo.jpg' %}" alt="CIME Logo" class="cime-login-logo">
            <h1 class="cime-login-title">Acceso a la Clínica de Imágenes – CIME</h1>
        </div>

        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}

            <label for="{{ form.username.id_for_label }}">Usuario</label>
            {{ form.username }}
            {{ form.username.errors }}

            <label for="{{ form.password.id_for_label }}">Contraseña</label>
            <div class="cime-password-wrapper">
                {{ form.password }}
                <span class="cime-password-toggle" data-target="{{ form.password.id_for_label }}">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a20.4 20.4 0 0 1 5.06-5.94M9.9 4.24A10.6 10.6 0 0 1 12 4c7 0 11 7 11 7a20.5 20.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>
                </span>
            </div>
            {{ form.password.errors }}

            <div class="cime-forgot-password">
                <a href="#">¿Olvidó su contraseña?</a>
            </div>

            <button type="submit" class="cime-btn-submit">
                <svg width="14" height="14"><use href="#i-log-in"/></svg>
                Ingresar
            </button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>

    <script>
        document.querySelectorAll('.cime-password-toggle').forEach(function (toggle) {
            toggle.addEventListener('click', function () {
                var input = document.getElementById(toggle.dataset.target);
                var eye = toggle.querySelector('.icon-eye');
                var eyeOff = toggle.querySelector('.icon-eye-off');
                var isHidden = input.type === 'password';
                input.type = isHidden ? 'text' : 'password';
                eye.style.display = isHidden ? 'none' : 'block';
                eyeOff.style.display = isHidden ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
