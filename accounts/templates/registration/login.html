<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Clínica de Imágenes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .fondo-medico {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            filter: blur(7px);
            transform: scale(1.06);
            z-index: 0;
        }
        .card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.45);
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: #0f172a;
            text-align: center;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
            color: #334155;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.6rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #1d4ed8;
        }
        .errorlist {
            color: #dc2626;
            font-size: 0.85rem;
            list-style: none;
            padding: 0;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <svg class="fondo-medico" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="800" height="600" fill="#0f172a"/>
        <circle cx="150" cy="120" r="230" fill="#1e3a8a" opacity="0.55"/>
        <circle cx="660" cy="470" r="270" fill="#0e7490" opacity="0.5"/>
        <circle cx="600" cy="90" r="140" fill="#0369a1" opacity="0.4"/>

        <!-- silueta tipo radiografía de tórax -->
        <g fill="none" stroke="#e2e8f0" stroke-width="5" opacity="0.35">
            <path d="M320 460 C280 380 270 300 300 230 C320 180 360 150 400 150
                     C440 150 480 180 500 230 C530 300 520 380 480 460
                     C460 500 420 520 400 520 C380 520 340 500 320 460 Z"/>
            <path d="M400 170 L400 500"/>
            <path d="M330 240 C310 300 305 360 330 430"/>
            <path d="M470 240 C490 300 495 360 470 430"/>
        </g>

        <!-- cruces médicas -->
        <g fill="#38bdf8" opacity="0.3">
            <rect x="120" y="380" width="34" height="130" rx="8"/>
            <rect x="70" y="430" width="130" height="34" rx="8"/>
            <rect x="600" y="220" width="26" height="100" rx="6"/>
            <rect x="562" y="258" width="100" height="26" rx="6"/>
        </g>

        <!-- línea de electrocardiograma -->
        <polyline points="0,540 140,540 175,470 210,600 245,500 280,540 800,540"
                   fill="none" stroke="#22d3ee" stroke-width="6" opacity="0.55"
                   stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="card">
        <h1>Clínica de Imágenes — Acceso</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <label for="{{ form.username.id_for_label }}">Usuario</label>
            {{ form.username }}
            {{ form.username.errors }}
            <label for="{{ form.password.id_for_label }}">Contraseña</label>
            {{ form.password }}
            {{ form.password.errors }}
            <button type="submit">Ingresar</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</body>
</html>
